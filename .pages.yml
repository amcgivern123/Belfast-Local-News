# Pages CMS editor settings (https://app.pagescms.org)
# Lets you add and edit articles and offers through simple web forms.

media:
  input: public/images
  output: /images

content:
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    format: yaml-frontmatter
    filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
    view: { primary: "title", sort: "date", order: "desc" }
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: description
        label: Summary
        type: text
        required: true
        description: "One or two sentences. Shown under the headline and in Google results."
      - name: date
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: "Set a future date to schedule it (it appears after the daily rebuild on that day)."
      - name: category
        label: Section
        type: select
        required: true
        options:
          values:
            - name: new-openings
              label: New Openings
            - name: food-drink
              label: Food & Drink
            - name: trades-services
              label: Trades & Services
            - name: retail
              label: Retail
            - name: events
              label: Events
            - name: community
              label: Community
      - name: area
        label: Area
        type: string
        description: "e.g. Lisburn Road, Ormeau Road, Botanic"
      - name: author
        label: Author
        type: string
        default: Belfast Local Business
      - name: image
        label: Main photo
        type: image
        description: "Landscape photos work best, ideally at least 1200px wide."
      - name: imageAlt
        label: Photo description
        type: string
        description: "Describe the photo in a few words. Helps Google and blind readers."
      - name: pinned
        label: Pin to top of homepage
        type: boolean
        default: false
        description: "Keeps this as the lead story. Untick it when you want to replace it."
      - name: draft
        label: Draft (hide from site)
        type: boolean
        default: false
      - name: body
        label: Article
        type: rich-text

  - name: offers
    label: Offers
    type: collection
    path: src/content/offers
    format: yaml-frontmatter
    filename: { template: "{year}-{month}-{day}-{primary}.md", field: create }
    view: { primary: "business", sort: "ends", order: "asc" }
    fields:
      - name: business
        label: Business name
        type: string
        required: true
      - name: offer
        label: The offer
        type: string
        required: true
        description: "Short and punchy, e.g. 2 for 1 lunches, Mon–Wed"
      - name: area
        label: Area
        type: string
      - name: ends
        label: Offer ends
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: "The offer disappears from the site automatically after this date."
      - name: details
        label: Details
        type: text
      - name: link
        label: Business website or social link
        type: string
